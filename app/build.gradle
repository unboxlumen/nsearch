apply plugin: 'com.android.application'

android {
    compileSdk 36
    namespace 'com.unbox.nsearch'
    // Lucene 8 / PDFBox / jxl depend on java.nio.file + java.time; desugaring backports them to API 21.
    configurations.all {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
    android.buildFeatures.buildConfig true
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled true
    }
    signingConfigs {
        // 共用 debug 签名：多台电脑打出的 debug 包签名一致，可互相覆盖安装
        debug {
            storeFile file("../signing/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    defaultConfig {
        applicationId "com.unbox.nsearch"
        // Lucene 8 的 AttributeFactory / MMapDirectory 与 Snowball 词干分析器使用
        // MethodHandle.invoke/invokeExact，D8 仅在 minSdk >= 26 时支持，故最低 26。
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "0.0.1"
        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            versionNameSuffix "-debug"
        }
        release {
            // 内部发布：复用共享 debug 签名
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
        }
    }

    lint {
        checkReleaseBuilds false
        disable 'MissingTranslation'
        abortOnError false
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    // Lucene uses META-INF/services for codec registration; merge them instead of failing on dupes.
    packaging {
        resources {
            merges += ["META-INF/services/*"]
            excludes += ["META-INF/DEPENDENCIES", "META-INF/LICENSE", "META-INF/LICENSE.txt",
                         "META-INF/NOTICE", "META-INF/NOTICE.txt", "META-INF/*.kotlin_module",
                         "META-INF/INDEX.LIST"]
        }
    }

    return void
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.3.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.12.0'

    // Java 8+ API 脱糖（API 21 上使用 java.nio.file / java.time 等）
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    // --- 全文检索引擎 Apache Lucene（8.11.3：最后一个 Java 8 版本，Android 最稳） ---
    implementation 'org.apache.lucene:lucene-core:8.11.3'
    implementation 'org.apache.lucene:lucene-queryparser:8.11.3'
    implementation 'org.apache.lucene:lucene-analyzers-common:8.11.3'
    implementation 'org.apache.lucene:lucene-analyzers-icu:8.11.3'   // ICUTokenizer：多语言分词（CJK 之外脚本）
    implementation 'org.apache.lucene:lucene-highlighter:8.11.3'      // 命中高亮摘要

    // --- 中文分词：jieba（仅对汉字做词级切分，其余脚本仍走 ICU）---
    implementation 'com.huaban:jieba-analysis:1.0.2'

    // --- 文件内容提取 ---
    // PDF 文本提取使用 Apache PDFBox（桌面版，Maven Central 可直接解析）。
    // 注：PDFBox 桌面版在渲染路径依赖 java.awt，但纯文本抽取（PDFTextStripper）
    // 对绝大多数内嵌字体 PDF 在 Android 上可用；若需完整 Android 适配，可把
    // TomRoush 的 PDFBox-Android AAR 放入 app/libs 并替换此依赖。
    implementation 'org.apache.pdfbox:pdfbox:2.0.27'                 // PDF 文本提取
    implementation 'net.sourceforge.jexcelapi:jxl:2.6.12'             // .xls 读取

    // --- 老格式 .doc / .ppt 正文抽取：Apache POI（HWPF + HSLF，位于 poi-scratchpad）---
    // 代价：release 包约 +10–18MB（poi 核心 + scratchpad + commons-io）。
    // 纯文本抽取不触发 java.awt，缺失引用已由 proguard -dontwarn 屏蔽；运行时异常在 Extractor 内 try/catch 兜底。
    implementation 'org.apache.poi:poi:5.2.5'
    implementation 'org.apache.poi:poi-scratchpad:5.2.5'

    // Profile Installer - 启动优化（AOT 编译）
    implementation 'androidx.profileinstaller:profileinstaller:1.4.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
